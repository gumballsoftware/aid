spring:
  docker:
    compose:
      skip:
        in-tests: false
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: myuser
    password: secret
  application:
    name: aid
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        remove-existing-vector-store-table: false
        initialize-schema: true
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen:7b
      embedding:
        model: qwen:7b

ingest-properties:
  schedule-url: https://raw.githubusercontent.com/gumballsoftware/devnexus-site/master/_data/schedule.json
  schedule-fileName: schedule.json
  eventsURL: https://raw.githubusercontent.com/gumballsoftware/devnexus-site/master/_data/events.json
  eventsFileName: events.json
  speakersURL: https://raw.githubusercontent.com/gumballsoftware/devnexus-site/master/_data/speakers.json
  speakersFileName: speakers.json

logging:
  level:
    root: info

